[project]
name = "zelos-extension-v2g"
version = "0.1.0"
description = "ISO 15118 / DIN 70121 EV charging (V2G) decode for Zelos"
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "v2g", "iso15118", "din70121", "ccs", "ev-charging", "tls", "pcap"]
dependencies = [
    # 0.0.13 has `hidden=` actions.
    "zelos-sdk>=0.0.13",
    "rich-click>=1.8.0",
    # Rust-cored capture and V2G decode. Exact pin: the decoder surface and the
    # privileged capture helper are matched to one release.
    "zelos-packet==0.0.7",
]

[project.scripts]
zelos-extension-v2g = "main:cli"

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-v2g"
Repository = "https://github.com/zeloscloud/zelos-extension-v2g"
Issues = "https://github.com/zeloscloud/zelos-extension-v2g/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_v2g"]

# `main.py` is the extension entry point and the console script's module
# (`main:cli`), so the wheel carries it alongside the package.
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (frozen dataclass defaults)
]
