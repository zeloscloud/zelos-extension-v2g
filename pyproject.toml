[project]
name = "zelos-extension-v2g"
version = "0.1.0"
description = "Decode ISO 15118-2 and DIN 70121 EV charging (V2G) into signals: SLAC, SDP and V2GTP messages live from a network interface, or from a pcap or pcapng capture, with its SocketCAN frames, converted to one .trz trace; message fields decode on Linux and Apple silicon macOS."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "v2g", "iso15118", "din70121", "ccs", "ev-charging", "exi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    "scapy>=2.5.0",
    "zelos-can>=0.0.7a0",
]

[project.scripts]
zelos-extension-v2g = "main:cli"

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-v2g"
Repository = "https://github.com/zeloscloud/zelos-extension-v2g"
Issues = "https://github.com/zeloscloud/zelos-extension-v2g/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_v2g"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]
