name = "V2G"
version = "0.1.0"
description = "ISO 15118 / DIN 70121 V2G (EV-charger) communication decode and pcap-to-trace conversion"
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-v2g"
icon = "assets/icon.svg"
readme = "README.md"

# Compatibility floor: 26.0.8 is the first release whose config form drops a
# `ui:widget` it does not register instead of crashing. This config names
# `action-choices`, so older apps must not install it.
[zelos]
version = ">=26.0.8"

[config]
schema = "config.schema.json"

[host]
type = "agent"

[host.agent]
entry = "main.py"
python_version = "3.11"

# Package boundary. extension.toml, README.md, config.schema.json, the icon,
# pyproject.toml, uv.lock and the generated actions.json are added automatically.
[package]
paths = ["main.py", "zelos_extension_v2g"]
