name = "V2G"
version = "0.1.0"
description = "Decode ISO 15118-2 and DIN 70121 EV charging (V2G) into signals: SLAC, SDP and V2GTP messages live from a network interface, or from a pcap or pcapng capture, with its SocketCAN frames, converted to one .trz trace; message fields decode on Linux and Apple silicon macOS."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-v2g"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["ev charging", "ev charger", "evse", "evcc", "secc", "ccs", "combined charging system", "vehicle to grid", "iso 15118", "slac", "homeplug av", "green phy", "exi", "pcap", "wireshark", "tcpdump", "charge point", "charging station", "iso 15118-2", "din70121"]
categories = ["Automotive", "Energy", "Networking", "Diagnostics"]
icon = "assets/icon.svg"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_v2g"]
